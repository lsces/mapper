<!-- MapServer Template -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Navigation</title>
<link rel="stylesheet" href="../styles/client.css" type="text/css">

<script language="javascript">
var t = parent.ScriptFrame;

function updateLayer(){
	if(t.layerList.length>1){
		for(i=0;i<this.document.navi.layer.length;i++) {
			if (this.document.navi.layer[i].checked) {
				t.layerVisible[i]=1;
			} else {
				t.layerVisible[i]=0;
			}
		}
	} else {
			if (this.document.navi.layer.checked) {
				t.layerVisible[0]=1;
			} else {
				t.layerVisible[0]=0;
			}
	}
	if(t.hasCommonLayers){
		if(t.commonLayerList.length>1){
			for(j=0;j<this.document.navi.common.length;j++) {
				if (this.document.navi.common[j].checked) {
					t.commonLayerIsVisible[j]=1;
				} else {
					t.commonLayerIsVisible[j]=0;
				}
			}
		}
		else {
				if (this.document.navi.common.checked) {
					t.commonLayerIsVisible[0]=1;
				} else {
					t.commonLayerIsVisible[0]=0;
				}
		}
	}
	t.refreshMap('newLayer');

}


function refreshVisibility() {
	if(t.layerList.length>1){
		for(i=0;i<this.document.navi.layer.length;i++) {
			if (this.document.navi.layer[i].checked) {
				t.layerVisible[i]=1;
			} else {
				t.layerVisible[i]=0;
			}
		}
	} else {
			if (this.document.navi.layer.checked) {
				t.layerVisible[0]=1;
			} else {
				t.layerVisible[0]=0;
			}
	}
	if(t.hasCommonLayers){
		if(t.commonLayerList.length>1){
			for(j=0;j<this.document.navi.common.length;j++) {
				if (this.document.navi.common[j].checked) {
					t.commonLayerIsVisible[j]=1;
				} else {
					t.commonLayerIsVisible[j]=0;
				}
			}
		}
		else {
				if (this.document.navi.common.checked) {
					t.commonLayerIsVisible[0]=1;
				} else {
					t.commonLayerIsVisible[0]=0;
				}
		}
	}
}


</script>
</head>

<body>
<script language="javascript">

var t = parent.ScriptFrame;
	if (t.isNav){
		if(t.SharedColor1!=null){
			document.body.setAttribute('bgcolor', t.SharedColor1);
			document.body.setAttribute('marginwidth', '7');
			document.body.setAttribute('marginheight', '0');
			document.body.setAttribute('vlink', '#000000');
			document.body.setAttribute('link', '#000000');
			document.body.setAttribute('alink', '#000000');
		}else{
			document.body.setAttribute('bgcolor', '#FFFFFF');
			document.body.setAttribute('leftmargin', '1');
			document.body.setAttribute('topmargin', '5');
			document.body.setAttribute('marginwidth', '1');
			document.body.setAttribute('marginheight', '5');
			window.onload = function(){ Load3(); };
		}
	} else {
		if(t.SharedColor1!=null){
			document.body.setAttribute('bgcolor', t.SharedColor1);
			document.body.setAttribute('leftmargin', '7');
			document.body.setAttribute('topmargin', '5');
			document.body.setAttribute('marginwidth', '7');
			document.body.setAttribute('marginheight', '5');
			document.body.setAttribute('vlink', '#000000');
			document.body.setAttribute('link', '#000000');
			document.body.setAttribute('alink', '#000000');
		}else{
			document.body.setAttribute('bgcolor', '#FFFFFF');
			document.body.setAttribute('leftmargin', '1');
			document.body.setAttribute('topmargin', '5');
			document.body.setAttribute('marginwidth', '1');
			document.body.setAttribute('marginheight', '5');
			window.onload = function(){ Load3(); };
		}
	}
	var naviHtml = '<form name="navi">';
	naviHtml += '<table width="100% border="0" cellspacing="0" cellpadding="0">';
	naviHtml += '<tr><td><img src="' + t.visibilityIconURL + '" width="14" height="14" border="0" hspace="4" alt="' + t.toolName[0] + '" onmouseover="window.status=\' ' + t.toolName[0] + '\'" onmouseout="window.status=\'\'"></td>';
	naviHtml += '<td colspan="2"></td></tr>';

	for(i=0;i<t.layerList.length;i++){
		naviHtml += '<tr>';
		naviHtml += '<td>';
		naviHtml += '<input type="radio"  name="layer" value="' + t.layerList[i] + '"';
		if(t.autoRefresh){
			 naviHtml += ' onClick="updateLayer()"';
		}else{
			naviHtml += ' onClick="refreshVisibility()"';
		}

		if(t.layerVisible[i]) naviHtml += ' checked';
		naviHtml += '></td>';
		naviHtml += '<td>';
		naviHtml += '</td>';
		naviHtml += '<td>';
		if (t.layerLink[i]) {
			naviHtml += '<a href="#" id="' + i + '" title="'+t.layerLinkName[i]+'" onmousedown="t.WindowLink('+i+')">&nbsp;' + t.layerAlias[i] + '</a>';
		} else {
			naviHtml += t.layerAlias[i];
		}
		if(t.layerIsQueryable[i]) naviHtml += '<img src="'+t.queryURL+'">';
		naviHtml += '</td>';
		naviHtml += '</tr>';
	}

	naviHtml += '<tr><td height="5"></td></tr>';
	if(t.hasCommonLayers){
		naviHtml += '<tr><td colspan="3" class="heading-sm">Base Information</td></tr>';
		naviHtml += '<tr><td colspan="3" height="10"><img src="' + t.spacerPixelURL + '" width="168" height="1" border="0" alt=""></td></tr>';

		for(i=0;i<t.commonLayerList.length;i++) {
			naviHtml += '<tr>';
			naviHtml += '<td>';
			naviHtml += '<input type="checkbox" name="common" value="'+t.commonLayerList[i]+'"';
			if(t.autoRefresh){
				 naviHtml += ' onClick="updateLayer()"';
			}else{
				naviHtml += ' onClick="refreshVisibility()"';
			}
			if(t.commonLayerIsVisible[i]) naviHtml += ' checked';
			naviHtml += '></td>';
			naviHtml += '<td></td>';
			naviHtml += '<td>&nbsp;'+t.commonLayerAlias[i]+'</td>';
			naviHtml += '</tr>';
		}
	}

naviHtml += '</table>';
naviHtml += '</form>';
if(t.autoRefresh==false){
    naviHtml += '<DIV align="center" style="margin-top:25px;">';
	naviHtml += '<img src="'+t.imagePath1+'/nk2.gif" onMouseDown="updateLayer()"';
	naviHtml += '</DIV>';
}
document.body.insertAdjacentHTML('beforeend', naviHtml);
</script>
</body>
</html>
