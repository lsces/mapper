<!DOCTYPE html>
<!-- MapServer Template -->
<html>
<head>
<title>Toolbar</title>
<meta charset="UTF-8">
<script language="javascript">
var t = parent.ScriptFrame;
var tw = t.ToolWidth;
var th = t.ToolHeight;
//alignment of the toolbar buttons
var horizontal = "left";
var styleLink = document.createElement('link');
styleLink.rel = 'stylesheet';
styleLink.type = 'text/css';
styleLink.href = t.styleURL;
document.head.appendChild(styleLink);
</script>
</head>

<body>
<script language="javascript">
if(t.ToolFrameColor !=null){
	document.body.setAttribute('bgcolor', t.ToolFrameColor);
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '0');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '0');
}else{
	document.body.setAttribute('bgcolor', '#FFFFFF');
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '5');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '5');
	window.onload = function(){ Load3(); };
}
var toolbarHtml = '<div align="center">';
toolbarHtml += '<table width="77" cellspacing="0" cellpadding="1" border="0">';
toolbarHtml += '<tr><td colspan="6" height="3"></td></tr>';
toolbarHtml += '<tr>';
if (t.ZoomInTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="zoomin" src="' + t.ZoomInURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[5] + '" onmouseover="window.status=\' ' + t.toolName[5] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'zoomin\');t.turnSelected(\'zoomin\')"></td>';
}
if (t.ZoomOutTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="zoomout" src="' + t.ZoomOutURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[6] + '" onmouseover="window.status=\' ' + t.toolName[6] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'zoomout\');t.turnSelected(\'zoomout\')"></td>';
}
if (t.FullExtentTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="fextent" src="' + t.FullExtentURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[7] + '" onmouseover="window.status=\' ' + t.toolName[7] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'fullextent\')"></td>';
}
if (t.PanTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="pan" src="' + t.PanURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[8] + '" onmouseover="window.status=\' ' + t.toolName[8] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'pan\');t.turnSelected(\'pan\')"></td>';
}
if (t.InfoTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="info" src="' + t.InfoURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[9] + '" onmouseover="window.status=\' ' + t.toolName[9] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'info\');t.turnSelected(\'info\')"></td>';
}
if (t.HelpTool) {
toolbarHtml += '<td align="' + horizontal + '"><img name="help" src="' + t.HelpURL + '" width="' + tw + '" height="' + th + '" alt="' + t.toolName[10] + '" onmouseover="window.status=\' ' + t.toolName[10] + '\'" onmouseout="window.status=\'\'" onmousedown="t.setTool(\'help\')"></td>';
}
toolbarHtml += '</tr>';
toolbarHtml += '</table>';
toolbarHtml += '</div>';
document.body.insertAdjacentHTML('beforeend', toolbarHtml);
</script>
<div align="center">
<form name="coordinateDisplay">
x: <input type="text" name="x"><BR>
y: <input type="text" name="y">
</form>
</div>
<script language="javascript">
//toolbar row count and the coordinate box are both fixed, but keeping this
//in step with navi.html/form.html/legend.html rather than another hardcoded height
window.addEventListener('load', function() {
	if (window.frameElement) {
		window.frameElement.style.height = (document.body.scrollHeight + 10) + 'px';
	}
});
</script>
</body>
</html>
