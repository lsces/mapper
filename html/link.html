<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Further Links</title>
<script language="javascript">
var t = parent.ScriptFrame;
var styleLink = document.createElement('link');
styleLink.rel = 'stylesheet';
styleLink.type = 'text/css';
styleLink.href = t.styleURL;
document.head.appendChild(styleLink);
</script>
</head>

<body>
<script language="javascript">
if(t.SharedColor1!=null){
	document.body.setAttribute('scroll', 'auto');
	document.body.setAttribute('bgcolor', t.SharedColor1);
	document.body.setAttribute('leftmargin', '7');
	document.body.setAttribute('topmargin', '5');
	document.body.setAttribute('marginwidth', '7');
	document.body.setAttribute('marginheight', '5');
	document.body.setAttribute('link', '#000000');
	document.body.setAttribute('vlink', '#000000');
	document.body.setAttribute('alink', '#000000');
}else{
	document.body.setAttribute('bgcolor', '#FFFFFF');
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '5');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '5');
	window.onload = function(){ Load3(); };
}
var linkHtml = '';
if( t.mapsetKey === 'test' ) {
	linkHtml += '<p class="demo-notice"><em>This is a demonstration map. Log in for the full map catalogue.</em></p>';
}
if( t.viewerSwitchUrl ) {
	// target _top: these are frames inside the page, the switch must replace the whole page
	linkHtml += '<p><a href="' + t.viewerSwitchUrl + '" target="_top" title="Open this map in the Leaflet viewer" style="display:inline-block; padding:2px 8px; border:1px solid #888; border-radius:3px; text-decoration:none;">Open in Leaflet viewer</a></p>';
}
linkHtml += '<table width="100%" cellspacing="0" cellpadding="2" border="0">';
for (i=0;i<t.furtherLink.length;i++) {
	linkHtml += '<tr>';
	if(t.furtherLinkURL!=null){
		linkHtml += '<td class="link"><a href="' + t.furtherLinkURL[i] + '" target="_blank" title="' + t.furtherLinkName[i] + '">' + t.furtherLink[i] + '</a></td>';
	}
	linkHtml += '</tr>';
}
linkHtml += '</table>';
document.body.insertAdjacentHTML('beforeend', linkHtml);
</script>
</body>
</html>
