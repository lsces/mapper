<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Initialize the Map</title>
</head>

<body>
<script language="javascript">
var t = parent.ScriptFrame;
var initHtml = '<form name="init" method=GET action="' + t.exePath + '">';
initHtml += '<input type="hidden" name="map" value="' + t.mapPath + '">';
for (i=0;i<t.layerList.length;i++) {
		if (t.layerVisible[i]==1) initHtml += '<input type="hidden" name="layer" value="' + t.layerList[i] + '">';
}
for (i=0;i<t.commonLayerList.length;i++) {
	if(t.commonLayerIsVisible[i]==1) initHtml += '<input type="hidden" name="layer" value="' + t.commonLayerList[i] + '">';
}
initHtml += '<input type="hidden" name="zoomsize" value="' + t.zoomsize + '">';
initHtml += '<input type="hidden" name="mapsize" value="' + t.MapWidth + ' ' + t.MapHeight + '">';
initHtml += '<input type="hidden" name="mapext" value="' + t.computeCoverExtent(t.fullExtent, t.MapWidth, t.MapHeight) + '">';
initHtml += '</form>';
document.body.insertAdjacentHTML('beforeend', initHtml);
parent.FormFrame.document.init.submit();
</script>
</body>
</html>
