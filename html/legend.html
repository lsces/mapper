<!DOCTYPE html>
<html>
<head>
<title>Legend</title>
<meta charset="UTF-8">
<script language="javascript">

var t = parent.ScriptFrame;
var styleLink = document.createElement('link');
styleLink.rel = 'stylesheet';
styleLink.type = 'text/css';
styleLink.href = t.styleURL;
document.head.appendChild(styleLink);
</script>
</head>
<body bgcolor="#FFFFFF">
<script language="javascript">
if(t.LegendFrameColor!=null){
	document.body.setAttribute('scroll', 'auto');
	document.body.setAttribute('bgcolor', t.LegendFrameColor);
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '2');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '2');
}else{
	document.body.setAttribute('bgcolor', '#FFFFFF');
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '5');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '5');
	window.onload = function(){ Load3(); };
}
var legendHtml;
if(parent.ScriptFrame.hasHTMLLegend){
	legendHtml = '<TABLE>';
	if (parent.FormFrame.leg!=null){
		legendHtml += parent.FormFrame.leg;
	}
	legendHtml += '</TABLE>';
} else {
	legendHtml = '<img src="'+parent.FormFrame.leg+'">';
}
document.body.insertAdjacentHTML('beforeend', legendHtml);
</script>
</body>
</html>
