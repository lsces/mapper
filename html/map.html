<!-- MapServer Template -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Map</title>
<script type="text/javascript" language="javascript" src="../scripts/wz_jsgraphics.js"></script>
<script language="javascript">
//Shorthand variables
var t = parent.ScriptFrame;
var n = parent.FormFrame;
var ROS = t.BorderOutSize;
var RIS = t.BorderInSize;

function reload(){
	this.document.location.href = parent.ScriptFrame.htmlPath + "start.html";
}	
</script>
</head>

<body>
<script language="javascript">
if(t.MapFrameColor!=null){
	document.body.setAttribute('bgcolor', t.MapFrameColor);
	document.body.setAttribute('leftmargin', '0');
	document.body.setAttribute('topmargin', '0');
	document.body.setAttribute('marginwidth', '0');
	document.body.setAttribute('marginheight', '0');
	window.onresize = reload;
}else{
	document.body.setAttribute('bgcolor', '#FFFFFF');
	document.body.setAttribute('leftmargin', '1');
	document.body.setAttribute('topmargin', '5');
	document.body.setAttribute('marginwidth', '1');
	document.body.setAttribute('marginheight', '5');
	window.onload = function(){ Load3(); };
	window.onresize = reload;
}

//BackLayer1: outer Border
t.createBackLayer1("mapBack1", t.borderPosLeft, t.borderPosTop, t.BackWidth1, t.BackHeight1, 2, t.BorderOutColor, true);

//BackLayer2 : Space between borders. Filled with Color or Image.
if (t.BorderGapImage == true) { //(Variable from param.js)
	t.createBackLayer2("mapBack2", (t.borderPosLeft+ROS), (t.borderPosTop+ROS), t.BackWidth2, t.BackHeight2, 3, t.BorderGapImageURL, true);
} else {
	t.createBackLayer1("mapBack2", (t.borderPosLeft+ROS), (t.borderPosTop+ROS), t.BackWidth2, t.BackHeight2, 3, t.BorderGapColor, true);
}

//BackLayer3: inner Border
t.createBackLayer1("mapBack3", (t.posleft-RIS), (t.postop-RIS), t.BackWidth3, t.BackHeight3, 4, t.BorderInColor, true);

//BackLayer4: Layer for the Backgroundcolor within MapLayer (becomes visible if the map is moved (Pan))
t.createBackLayer1("mapBack4", t.posleft, t.postop, t.MapWidth, t.MapHeight, 5, t.MapBackColor, true);

//MapLayer: Layer for the MapImage
//explicit width/height forces the image to fit its containing div exactly - without them the
//img renders at whatever size mapserv actually returned, which can differ slightly from the
//requested mapsize (MapServer sometimes adjusts to preserve the mapfile's own EXTENT aspect
//ratio rather than force-fitting a mismatched box), causing a small overflow/scrollbar.
var MapLayer = new String;
MapLayer = '<img style="display:block;" src="' + n.map + '" width="' + t.MapWidth + '" height="' + t.MapHeight + '" border="0">';
t.createMapLayer("mapimage", t.posleft, t.postop, t.MapWidth, t.MapHeight, 99, t.MapBackColor, true, MapLayer);

//Layer for the directional pan buttons
if (t.JumpTool_MF == true) { //(Variable from param.js)
	//..."North"
	var NorthLayer = new String;
	NorthLayer = '<img style="display:block;" src="' + t.NorthURL_MF + '" width="' + t.NorthSouthWidth_MF + '" height="' + t.NorthSouthHeight_MF +'" alt="' + t.toolName[1] + '" border="0" onmouseover="window.status=\' ' + t.toolName[1] + '\'" onmouseout="window.status=\'\'" onmousedown="parent.ScriptFrame.jump(\'north\')">';
	t.createElseLayer("North", t.northposleft, t.northpostop, t.NorthSouthWidth_MF, t.NorthSouthHeight_MF, 6, true, NorthLayer);
						
	//..."South"
	var SouthLayer = new String;
	SouthLayer = '<img style="display:block;" src="' + t.SouthURL_MF + '" width="' + t.NorthSouthWidth_MF + '" height="' + t.NorthSouthHeight_MF +'" alt="' + t.toolName[2] + '" border="0" onmouseover="window.status=\' ' + t.toolName[2] + '\'" onmouseout="window.status=\'\'" onmousedown="parent.ScriptFrame.jump(\'south\')">';
	t.createElseLayer("South", t.southposleft, t.southpostop, t.NorthSouthWidth_MF, t.NorthSouthHeight_MF,7, true, SouthLayer);
	
	//..."East"
	var EastLayer = new String;
	EastLayer = '<img style="display:block;" src="' + t.EastURL_MF + '" width="' + t.EastWestWidth_MF + '" height="' + t.EastWestHeight_MF +'" alt="' + t.toolName[3] + '" border="0" onmouseover="window.status=\' ' + t.toolName[3] + '\'" onmouseout="window.status=\'\'" onmousedown="parent.ScriptFrame.jump(\'east\')">';
	t.createElseLayer("East", t.eastposleft, t.eastpostop, t.EastWestWidth_MF, t.EastWestHeight_MF, 8, true, EastLayer);
	
	//..."West"
	var WestLayer = new String;
	WestLayer = '<img style="display:block;" src="' + t.WestURL_MF + '" width="' + t.EastWestWidth_MF + '" height="' + t.EastWestHeight_MF +'" alt="' + t.toolName[4] + '" border="0" onmouseover="window.status=\' ' + t.toolName[4] + '\'" onmouseout="window.status=\'\'" onmousedown="parent.ScriptFrame.jump(\'west\')">';
	t.createElseLayer("West", t.westposleft, t.westpostop, t.EastWestWidth_MF, t.EastWestHeight_MF, 9, true, WestLayer);
}

//Scale-Layer: Layer for the Scalebar
if (t.ShowScale == true) { //(Variable from param.js)
	var ScaleLayer = new String;
	ScaleLayer = '<img style="display:block;" src="' + n.scale + '" border="0" alt="">';
	t.createElseLayer("Scale", t.scaleposleft, t.scalepostop, t.ScaleWidth, t.ScaleHeight, 102, true, ScaleLayer);
}

//Status-Layer - zero-sized: refreshMap()/jump() call turnLayerVisible("Status")
//on every interaction expecting this element to exist, so it can't just be
//removed. Centered at StatusWidth/StatusHeight covered a big chunk of the
//new responsive frame size (was unobtrusive under the old fixed 600x600
//frameset) - zeroing the size keeps it present but invisible either way.
	var StatusLayer = new String;
	StatusLayer = '<img style="display:block;" src="' + t.StatusURL + '" width="0" height="0" border="0" alt="' + t.statusName + '">';
	t.createElseLayer("Status", t.statusposleft, t.statuspostop, 0, 0, 101, false, StatusLayer);

	//Graphics-Layer: Layer for the Zommbox and the crosshair
	document.body.insertAdjacentHTML('beforeend', '<div id="myCanvas" style="position:absolute;height:'+t.MapHeight+'px;width:'+t.MapWidth+'px; top:'+t.postop+'px; left:'+t.posleft+'px; z-index:10000"></div>');
	t.setEvents();
	jg = new jsGraphics("myCanvas");
	jg.setColor("#ff0000");

	document.body.insertAdjacentHTML('beforeend', '<div id="crossCanvas" style="position:absolute;height:'+t.MapHeight+'px;width:'+t.MapWidth+'px; top:'+t.postop+'px; left:'+t.posleft+'px; z-index:9999"></div>');
	crossH = new jsGraphics("crossCanvas");
	crossH.setColor("#B2ADAD");
	crossV = new jsGraphics("crossCanvas");
	crossV.setColor("#B2ADAD");
</script>
</body>
</html>
