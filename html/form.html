<!-- MapServer Template -->
<!DOCTYPE html>
<html>
<head>
<title>FormFrame</title>
<meta charset="UTF-8">
<meta http-equiv="pragma" content="no-cache">
<script language="javascript">
//Shorthand variable
var t = parent.ScriptFrame;
var styleLink = document.createElement('link');
styleLink.rel = 'stylesheet';
styleLink.type = 'text/css';
styleLink.href = t.styleURL;
document.head.appendChild(styleLink);

//Variables that holds the information coming back with the mapserver response
//Scalebarimage
var scale = new String;
scale = "[scalebar]";
//Mapimage
var map = new String;
map = "[img]";
//Legendimage or legend html (depends on legend mode)
var leg = new String;
leg = '[legend]';
//Mapextent
var ext = new String;
ext = "[mapext]";
parent.ScriptFrame.imgext = ext;


//Reloads the Map and the Legend whenever a new Map is drawn
function Load3() {
	parent.MapFrame.document.location = t.mapURL;
	parent.LegendFrame.document.location = t.legendURL;
	resizeToContent();
}

//the reference thumbnail's real pixel shape follows the mapset's own
//EXTENT aspect ratio (see mapper/CLAUDE.md), so this frame can't use a
//fixed height like the old single-mapset build did - size the iframe to
//whatever the (CSS-scaled) image actually renders at once it has loaded
function resizeToContent() {
	if (window.frameElement) {
		window.frameElement.style.height = (document.body.scrollHeight + 10) + 'px';
	}
}
</script>
</head>

<body leftmargin="1" topmargin="5" marginwidth="1" marginheight="5">
<script language="javascript">
document.body.setAttribute('bgcolor', t.FormFrameColor != null ? t.FormFrameColor : '#FFFFFF');
window.onload = Load3;
</script>
<table width="100%" border="0" cellspacing="0" cellpadding="1">
<tr>
<td align="center">

<form name="mapserv" action="[program]">
<input type="hidden" name="program" value="[program]">
<INPUT NAME="ref" TYPE="image" SRC="[ref]" border="0" onload="resizeToContent()">
<input type="hidden" name="map" value="[map]">
<input type="hidden" name="imgext" value="[mapext]">
<input type="hidden" name="layers" value="[layers]">
<input type="hidden" name="mapsize" value="[mapsize]">
</Form>

</tr>
</table>
</body>
</html>
