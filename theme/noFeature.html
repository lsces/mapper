<!-- MapServer Template -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script language="javascript">
//Abkuerzungsvariable
var o = opener.parent.ScriptFrame;
document.title = o.identifyTitle;
var styleLink = document.createElement('link');
styleLink.rel = 'stylesheet';
styleLink.type = 'text/css';
styleLink.href = o.styleURL;
document.head.appendChild(styleLink);
  </script>
</head>
<body leftmargin="13" topmargin="11" marginheight="11" marginwidth="13">
<script language="javascript">
document.body.setAttribute('bgcolor', o.IdentifyWinColor);
</script>
<div class="heading-sm">No element has been found to display information
for.
</div>
<div>In the layers:</div>
<script language="javascript">
o = opener.parent.ScriptFrame;
var layerHtml = '';
for(i=0; i<o.layerList.length;i++){
	if(o.layerIsQueryable[i]){
		layerHtml += '<DIV><B>';
		layerHtml += o.layerAlias[i]+'<BR>';
		layerHtml += '</B></DIV>';
		layerHtml += '<DIV>There is no symbol <img src="'+o.queryURL+'"> at this location in the layer';
	}
}
document.body.insertAdjacentHTML('beforeend', layerHtml);
</script>
</body>
</html>
